name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          # Query a real table so the request reaches Postgres (counts as DB activity).
          # 2xx or 401/403 (RLS / no grant for anon) both mean the DB answered; only fail on network errors or 5xx.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/guide_feedback?select=id&limit=1")
          echo "Supabase responded with HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi
